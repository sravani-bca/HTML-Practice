<html>
<head>
    <title>Pass by Value</title>
</head>
<body>

<script>
function changeValue(a)
{
    a = 100;
    document.write("Inside function: " + a + "<br>");
}

var x = 50;

document.write("Before function call: " + x + "<br>");

changeValue(x);

document.write("After function call: " + x);
</script>

</body>
</html>
