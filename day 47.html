<!DOCTYPE html>
<html>
<head>
    <title>CSS Visibility</title>
    <style>
        .visible {
            visibility: visible;
        }

        .hidden {
            visibility: hidden;
        }
    </style>
</head>
<body>

    <h2>CSS Visibility Property</h2>

    <p class="visible">This paragraph is visible.</p>

    <p class="hidden">This paragraph is hidden.</p>

    <p>The hidden paragraph still occupies space.</p>

</body>
</html>
