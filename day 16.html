<!DOCTYPE html>
<html>
<head>
    <title>Link Attributes</title>
</head>
<body>

    <h1>My Useful Links</h1>

    <a href="https://www.google.com"
       target="_blank"
       title="Open Google"
       rel="noopener"
       type="text/html">
       Visit Google
    </a>

    <br><br>

    <a href="https://www.wikipedia.org"
       target="_blank"
       title="Open Wikipedia"
       rel="noopener"
       type="text/html">
       Visit Wikipedia
    </a>

</body>
</html>
