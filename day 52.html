
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 5vw;
        }

        p {
            font-size: 2.5vw;
        }
    </style>
</head>
<body>

    <h1>Responsive Text</h1>
    <p>This text adjusts its size according to the screen width.</p>

</body>
</html>
