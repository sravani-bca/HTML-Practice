
<!DOCTYPE html>
<html>
<head>
    <title>DOM Methods</title>
</head>
<body>

    <h2 id="heading">Welcome to JavaScript</h2>

    <p class="para">This is the first paragraph.</p>

    <p>This is another paragraph.</p>

    <button onclick="changeContent()">Click Me</button>

    <script>
        function changeContent() {

            // getElementById()
            document.getElementById("heading").innerHTML =
            "DOM Methods Example";

            // getElementsByClassName()
            document.getElementsByClassName("para")[0].style.color = "blue";

            // getElementsByTagName()
            document.getElementsByTagName("p")[1].innerHTML =
            "Content Changed Successfully!";

            // querySelector()
            document.querySelector("h2").style.color = "red";

            // querySelectorAll()
            document.querySelectorAll("p")[0].style.fontSize = "20px";
        }
    </script>

</body>
</html>
