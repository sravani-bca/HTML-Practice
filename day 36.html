<!DOCTYPE html>
<html>
<head>
    <title>CSS Background</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            background-color: yellow;
            color: black;
        }

        p {
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>CSS Background</h1>
    <p>This is a paragraph with a background color.</p>

</body>
</html>
