<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>
        h1 {
            color: blue;
        }

        p {
            color: red;
        }

        .green-text {
            color: green;
        }

        .purple-text {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>CSS Colors</h1>

    <p>This paragraph is in red color.</p>

    <p class="green-text">This paragraph is in green color.</p>

    <p class="purple-text">This paragraph is in purple color.</p>

</body>
</html>
