
<html>
<head>
    <title>Example of If-else Statement</title>
</head>
<body>
    <script>
        var x = -2;

        if (x > 0)
        {
            document.write(x + " is a positive number");
        }
        else
        {
            document.write(x + " is a negative number");
        }
    </script>
</body>
</html>
