<!DOCTYPE html>
<html>
<head>
    <title>Embedded Style Sheet</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
        }

        body {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>My Web Page</h1>

    <p>This is an example of an Embedded Style Sheet.</p>

</body>
</html>
