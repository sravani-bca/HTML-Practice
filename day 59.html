
<!DOCTYPE html>
<html>
<head>
    <title>Finding Even or Odd</title>
</head>
<body>
    <script>
        var n;
        n = parseInt(window.prompt("Enter the value"));

        if (n % 2 == 0)
        {
            document.writeln("<h2>It is an even number</h2>");
        }
        else
        {
            document.writeln("<h2>It is an odd number</h2>");
        }
    </script>
</body>
</html>
