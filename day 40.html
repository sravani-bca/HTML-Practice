<!DOCTYPE html>
<html>
<head>
    <title>CSS Lists</title>
    <style>
        ul {
            list-style-type: square;
            color: blue;
        }

        ol {
            list-style-type: upper-roman;
            color: green;
        }
    </style>
</head>
<body>

    <h2>Unordered List</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Python</li>
        <li>C Programming</li>
        <li>Java</li>
    </ol>

</body>
</html>
