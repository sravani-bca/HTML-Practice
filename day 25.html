<!DOCTYPE html>
<html>
<head>
    <title>Day 25 - Form</title>

    <style>
        body {
            font-family: Arial;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required>
        <br><br>

        <label>College:</label>
        <input type="text" value="Megha Women's Degree College" readonly>
        <br><br>

        <label>Course:</label>
        <input type="text" value="BCA" disabled>
        <br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
