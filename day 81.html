<html>
<head>
<title>Fibonacci Series</title>
</head>
<body>
<script>
var n1 = 0, n2 = 1, temp, i;

var number = parseInt(prompt("Enter the number:"));

document.write("Fibonacci Series:");

for(i = 1; i <= number; i++)
{
    document.write("<br>" + n1);

    temp = n1 + n2;
    n1 = n2;
    n2 = temp;
}
</script>
</body>
</html>
