
<!DOCTYPE html>
<html>
<head>
    <title>CSS Multi Columns</title>
    <style>
        .content {
            column-count: 3;
            column-gap: 30px;
            column-rule: 2px solid black;
        }
    </style>
</head>
<body>

    <h2>CSS Multi-Columns Example</h2>

    <div class="content">
        CSS is used to style web pages.
        The multi-column property divides
        text into multiple columns.
        We can control the number of columns,
        the space between columns, and the
        line separating the columns.
        This makes long text easier to read.
    </div>

</body>
</html>
