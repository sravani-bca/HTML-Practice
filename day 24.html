<!DOCTYPE html>
<html>
<head>
    <title>Required, Disabled and Readonly</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form>
        <label>Name:</label>
        <input type="text" required>
        <br><br>

        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <label>Username:</label>
        <input type="text" value="Sravani" readonly>
        <br><br>

        <label>College:</label>
        <input type="text" value="Megha Women's Degree College" disabled>
        <br><br>

        <input type="submit" value="Register">
    </form>

</body>
</html>
