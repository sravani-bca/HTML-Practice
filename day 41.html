<!DOCTYPE html>
<html>
<head>
    <title>CSS Tables</title>

    <style>
        table {
            width: 60%;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }

        tr:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Sravani</td>
            <td>BCA</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Anu</td>
            <td>BCA</td>
            <td>90</td>
        </tr>
    </table>

</body>
</html>
