
<html>
<body>
<title>Logical Operators</title>

<script type="text/javascript">

var a = true;
var b = false;
var result;

var linebreak = "<br />";

document.write("(a && b) => ");
result = (a && b);
document.write(result);
document.write(linebreak);

document.write("(a || b) => ");
result = (a || b);
document.write(result);
document.write(linebreak);

document.write("!(a && b) => ");
result = !(a && b);
document.write(result);
document.write(linebreak);

</script>
</body>
</html>
