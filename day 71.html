<html>
<body>
<title>Assignment Operators</title>

<script type="text/javascript">

var a = 15;
var b = 12;
var linebreak = "<br />";

document.write("Value of a => (a = b) =>");
result = (a = b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a += b) =>");
result = (a += b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a -= b) =>");
result = (a -= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a *= b) =>");
result = (a *= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a /= b) =>");
result = (a /= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a %= b) =>");
result = (a %= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a <<= b) =>");
result = (a <<= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a >>= b) =>");
result = (a >>= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a >>>= b) =>");
result = (a >>>= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a &= b) =>");
result = (a &= b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a != b) =>");
result = (a != b);
document.write(result);
document.write(linebreak);

document.write("Value of a => (a ^= b) =>");
result = (a ^= b);
document.write(result);
document.write(linebreak);

</script>
</body>
</html>
