
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: steelblue;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            flex: 1;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            nav a {
                display: block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Welcome to my website!</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">
        <div class="box">
            <h2>HTML</h2>
            <p>HTML structures web pages.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>CSS styles web pages.</p>
        </div>

        <div class="box">
            <h2>Responsive Design</h2>
            <p>Websites adapt to different screens.</p>
        </div>
    </div>

    <footer>
        <p>Created by Sravani</p>
    </footer>

</body>
</html>
