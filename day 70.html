<html>
<head>
    <title>Arithmetic Operators</title>
</head>
<body>

<script language="javascript">

var a = 5;
var b = 4;
var linebreak = "<br/>";

document.write("a + b = " + (a+b));
document.write(linebreak);

document.write("a - b = " + (a-b));
document.write(linebreak);

document.write("a * b = " + (a*b));
document.write(linebreak);

document.write("a / b = " + (a/b));
document.write(linebreak);

document.write("a % b = " + (a%b));
document.write(linebreak);

document.write("++a = " + (++a));
document.write(linebreak);

document.write("a++ = " + (a++));
document.write(linebreak);

document.write("--b = " + (--b));
document.write(linebreak);

document.write("b-- = " + (b--));
document.write(linebreak);

</script>

</body>
</html>
