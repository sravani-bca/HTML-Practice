<!DOCTYPE html>
<html>
<head>
    <style type="text/css">
        p.cls {
            font-size: 28pt;
        }

        p#id1 {
            font-style: italic;
            color: red;
        }

        h1, h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <p class="cls">
        This is an example of class selector property
    </p>

    <p id="id1">
        This is an example of id selector property
    </p>

    <h1>This is an example of grouping selector</h1>
    <h2>This is an example of grouping selector</h2>

</body>
</html>
