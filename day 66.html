<!DOCTYPE html>
<html>
<head>
    <title>Function Expression</title>
</head>
<body>

    <h2>Function Expression Example</h2>

    <script>
        let add = function(a, b) {
            return a + b;
        };

        let result = add(10, 20);

        document.write("Sum = " + result);
    </script>

</body>
</html>
