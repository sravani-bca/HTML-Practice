<!DOCTYPE html>
<html>
<head>
    <title>Miscellaneous Usage of Arrays</title>
</head>
<body>

<script language="javascript">

    var elements = new Array(5);

    elements[0] = 6;
    elements[1] = 99.1;
    elements[2] = "SIA";
    elements[3] = 'S';

    document.write("<h1>" + elements.length + "</h1>");
    document.write(elements + "<br>");

    elements[30] = "Publishers";

    document.write("<h1>" + elements.length + "</h1>");
    document.write(elements);

</script>

</body>
</html>
