
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Variables</title>
</head>
<body>

    <h1>Example of JavaScript Variables</h1>
    <p id="EX"></p>

    <script>
        let x = 2;
        let y = 3;
        let z = x + y;

        document.getElementById("EX").innerHTML =
            "The value of z is: " + z;
    </script>

</body>
</html>
