<html>
<head>
    <title>Array Program</title>
</head>
<body>

<script>
// Declaring and allocating an array
var arr = new Array(5);

// Assigning values to array elements
arr[0] = 10;
arr[1] = 20;
arr[2] = 30;
arr[3] = 40;
arr[4] = 50;

// Displaying array elements
document.write("<h3>Declaring and Allocating an Array</h3>");
document.write("Array elements are:<br>");

for (var i = 0; i < 5; i++)
{
    document.write(arr[i] + "<br>");
}
</script>

</body>
</html>
