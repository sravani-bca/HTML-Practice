
<html>
<body>
<title>Comparison Operators</title>

<script type="text/javascript">

var a = 7;
var b = 25;
var linebreak = "<br />";

document.write("(a == b) =>");
result = (a == b);
document.write(result);
document.write(linebreak);

document.write("(a < b) =>");
result = (a < b);
document.write(result);
document.write(linebreak);

document.write("(a > b) =>");
result = (a > b);
document.write(result);
document.write(linebreak);

document.write("(a != b) =>");
result = (a != b);
document.write(result);
document.write(linebreak);

document.write("(a >= b) =>");
result = (a >= b);
document.write(result);
document.write(linebreak);

document.write("(a <= b) =>");
result = (a <= b);
document.write(result);
document.write(linebreak);

</script>

</body>
</html>
