<!DOCTYPE html>
<html>
<head>
    <title>CSS Outline</title>
    <style>
        p {
            border: 2px solid black;
            outline: 3px solid red;
            outline-offset: 5px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h2>CSS Outline Example</h2>

    <p>This is an example of CSS outline.</p>

</body>
</html>
