<!DOCTYPE html>
<html>
<head>
    <title>Global Scope</title>
</head>
<body>

<h2>JavaScript Global Scope</h2>

<p id="demo"></p>

<script>
    var a = 10;  // Global variable

    function display() {
        document.getElementById("demo").innerHTML =
        "Value of a is: " + a;
    }

    display();
</script>

</body>
</html>
